{{- if .Values.executor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app: executor
spec:
  replicas: {{ .Values.executor.replicas | int }}
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      containers:
        - name: executor
          image: {{ .Values.executor.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          ports:
            - containerPort: {{ .Values.executor.port | int }}
          env:
            {{- include "common.env" . | nindent 12 }}
            - name: PORT
              value: "{{ .Values.executor.port }}"
            - name: PRODUCTS_SERVICE_GRPC_URL
              value: "products:{{ .Values.products.port.grpc }}"
{{- end }}
