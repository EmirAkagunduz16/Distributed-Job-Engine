global:
  imagePullPolicy: Always

pulsar:
  namespace: pulsar
  namespaceCreate: true
  zookeeper:
    replicaCount: 1
    podMonitor:
      enabled: false
  broker:
    replicaCount: 1
    podMonitor:
      enabled: false
  bookkeeper:
    replicaCount: 1
    podMonitor:
      enabled: false
  autorecovery:
    podMonitor:
      enabled: false
  proxy:
    replicaCount: 1
    podMonitor:
      enabled: false
  kube-prometheus-stack:
    enabled: false
    prometheusOperator:
      enabled: false
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    prometheus:
      enabled: false
  components:
    pulsar_metadata: true

postgresql:
  namespaceOverride: postgresql
  auth:
    username: postgres
    password: postgres
  primary:
    initdb:
      scripts:
        create-dbs.sql: |
          CREATE DATABASE auth;
          CREATE DATABASE products;
  image:
    tag: "latest"


jobs:
  enabled: true
  replicas: 1
  image: '637423609014.dkr.ecr.us-east-1.amazonaws.com/jobber/jobs:latest'
  port: 3001

executor:
  enabled: true
  replicas: 1
  image: '637423609014.dkr.ecr.us-east-1.amazonaws.com/jobber/executor:latest'
  port: 3002

auth:
  enabled: true
  replicas: 1
  image: '637423609014.dkr.ecr.us-east-1.amazonaws.com/jobber/auth:latest'
  port:
    http: 3000
    grpc: 5000
  jwt:
    secret: t3iZUR9z9TH+EA0suMOF/O+QN91nBWV6rFcJf4IGL9M=
    expirationMs: 1d

products:
  enabled: true
  replicas: 1
  image: '637423609014.dkr.ecr.us-east-1.amazonaws.com/jobber/products:latest'
  port:
    http: 3003
    grpc: 5001